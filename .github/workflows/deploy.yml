name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      # A manual redeploy has no diff to compare against, so refresh
      # everything rather than guessing.
      force_all: ${{ github.event_name == 'workflow_dispatch' }}

  build-and-push:
    name: Build & push (${{ matrix.app }})
    needs: verify
    if: needs.verify.outputs.apps_list != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: ${{ fromJson(needs.verify.outputs.apps_json) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy to production
    needs: [verify, build-and-push]
    if: |
      always() &&
      needs.verify.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (needs.verify.outputs.apps_list != '' || needs.verify.outputs.gateway_changed == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync compose file & nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "docker-compose.prod.yml,deploy/nginx/templates,deploy/nginx/init-letsencrypt.sh"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - name: Pull changed images and restart only those services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin
            export REGISTRY_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}"

            SHA="${{ github.sha }}"
            APPS="${{ needs.verify.outputs.apps_list }}"
            GATEWAY_CHANGED="${{ needs.verify.outputs.gateway_changed }}"
            echo "Deploying apps: ${APPS:-none} (gateway changed: $GATEWAY_CHANGED)"

            for app in $APPS; do
              case "$app" in
                marketing)  export MARKETING_IMAGE_TAG="$SHA" ;;
                merchant)   export MERCHANT_IMAGE_TAG="$SHA" ;;
                storefront) export STOREFRONT_IMAGE_TAG="$SHA" ;;
              esac
            done

            if [ -n "$APPS" ]; then
              docker compose -f docker-compose.prod.yml --env-file .env.production pull $APPS
              docker compose -f docker-compose.prod.yml --env-file .env.production up -d $APPS
              docker image prune -f
            fi

            if [ "$GATEWAY_CHANGED" = "true" ]; then
              docker compose -f docker-compose.prod.yml --env-file .env.production up -d nginx
            fi
