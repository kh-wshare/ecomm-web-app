# Local-only gateway in front of apps running on the host via `pnpm *:dev`.
# For the production stack (TLS, GHCR images, certbot), use
# docker-compose.prod.yml instead.
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: commerce_gateway_dev
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
