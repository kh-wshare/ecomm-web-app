# Local-only gateway: plain HTTP, routes to the host machine where
# `pnpm <app>:dev` is running. Not used in production — see
# deploy/nginx/templates/default.conf.template and docker-compose.prod.yml
# for the TLS-terminating production gateway.
server {
    listen 80;
    server_name localhost;

    location /merchant/_next/static/ {
        proxy_pass http://host.docker.internal:3008;
        proxy_set_header Host $host;
    }

    location /merchant {
        proxy_pass http://host.docker.internal:3008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /_next/static/ {
        proxy_pass http://host.docker.internal:3002;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://host.docker.internal:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
